name: Publish to PowerShell Gallery

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag matches latest module version
        shell: pwsh
        run: |
          $tagVersion = ('${{ github.ref_name }}').TrimStart('v')
          $moduleRoot = Join-Path $PWD 'PlanetCrafterServer-module/PlanetCrafterServer'
          $versionDir = Get-ChildItem -Path $moduleRoot -Directory |
            Sort-Object { [version]$_.Name } |
            Select-Object -Last 1

          if (-not $versionDir) {
            throw "No versioned module directory was found under $moduleRoot."
          }

          $manifestPath = Join-Path $versionDir.FullName 'PlanetCrafterServer.psd1'
          $manifest = Import-PowerShellDataFile -Path $manifestPath

          if ($manifest.ModuleVersion -ne $tagVersion) {
            throw "Git tag '$tagVersion' does not match the module manifest version '$($manifest.ModuleVersion)'."
          }

          Write-Host "Validated tag $tagVersion against module version $($manifest.ModuleVersion)."

      - name: Create release zip
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $moduleVersion = $env:TAG_NAME.TrimStart('v')
          $moduleRoot = Join-Path $PWD 'PlanetCrafterServer-module/PlanetCrafterServer'
          $versionDir = Get-ChildItem -Path $moduleRoot -Directory |
            Sort-Object { [version]$_.Name } |
            Select-Object -Last 1

          if (-not $versionDir) {
            throw "No versioned module directory was found under $moduleRoot."
          }

          $workingRoot = Join-Path $env:RUNNER_TEMP "planet-crafter-release"
          if (Test-Path -LiteralPath $workingRoot) {
            Remove-Item -LiteralPath $workingRoot -Recurse -Force
          }

          $releaseDir = Join-Path $workingRoot 'PlanetCrafterServer'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item -Path $versionDir.FullName -Destination $releaseDir -Recurse -Force

          $zipPath = Join-Path $PWD "PlanetCrafterServer-v$moduleVersion.zip"
          Compress-Archive -Path $releaseDir -DestinationPath $zipPath -Force
          Write-Host "Created release zip at $zipPath"

      - name: Publish module to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            throw "Missing PSGALLERY_API_KEY secret in the repository settings."
          }

          $moduleRoot = Join-Path $PWD 'PlanetCrafterServer-module/PlanetCrafterServer'
          $versionDir = Get-ChildItem -Path $moduleRoot -Directory |
            Sort-Object { [version]$_.Name } |
            Select-Object -Last 1

          if (-not $versionDir) {
            throw "No versioned module directory was found under $moduleRoot."
          }

          Publish-Module -Path $versionDir.FullName -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY -Force

      - name: Upload GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: PlanetCrafterServer-v${{ github.ref_name }}.zip
          generate_release_notes: true
